<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow" />
    <title>{{.title}}</title>
    <link rel="shortcut icon" href="../static/favicon.ico">
    <script src="../static/marked.min.js"></script>
    <style>
        body {
            font-family: Arial, Helvetica Neue, Helvetica, sans-serif;
            font-size: 13px;
        }
        .container{
            width: 80%;
            margin: 0 auto;
        }
    </style>
    <link rel="stylesheet" href="../static/markdown.css">
</head>
<body>

<div class="container">
    <div id="content" class="markdown-body"></div>
</div>

<textarea id="raw-content" style="display:none;" readonly>{{.text}}</textarea>

<script>
    (function() {
        var rawText = document.getElementById('raw-content').value;

        // Escape raw HTML and block javascript: pseudo-protocol XSS
        marked.use({
            renderer: {
                html: function(html) {
                    return html
                        .replace(/&/g, "&amp;")
                        .replace(/</g, "&lt;")
                        .replace(/>/g, "&gt;")
                        .replace(/"/g, "&quot;")
                        .replace(/'/g, "&#39;");
                },
                link: function(href, title, text) {
                    var cleanHref = (href || '').trim().toLowerCase();
                    if (cleanHref.indexOf('javascript:') === 0 ||
                        cleanHref.indexOf('data:') === 0 ||
                        cleanHref.indexOf('vbscript:') === 0) {
                        return text;
                    }
                    var titleAttr = title ? ' title="' + title.replace(/"/g, '&quot;') + '"' : '';
                    return '<a href="' + href.replace(/"/g, '&quot;') + '"' + titleAttr + ' target="_blank" rel="noopener noreferrer">' + text + '</a>';
                },
                image: function(href, title, text) {
                    var cleanHref = (href || '').trim().toLowerCase();
                    if (cleanHref.indexOf('javascript:') === 0 || cleanHref.indexOf('vbscript:') === 0) {
                        return '';
                    }
                    var titleAttr = title ? ' title="' + title.replace(/"/g, '&quot;') + '"' : '';
                    var altAttr = text ? ' alt="' + text.replace(/"/g, '&quot;') + '"' : '';
                    return '<img src="' + href.replace(/"/g, '&quot;') + '"' + altAttr + titleAttr + '>';
                }
            }
        });

        document.getElementById('content').innerHTML = marked.parse(rawText);
    })();
</script>
</body>
</html>
